services:
  - type: web
    name: campus-sports-hub-backend
    env: python
    region: oregon
    buildCommand: "./build.sh"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: campus-sports-db
          property: connectionString

databases:
  - name: campus-sports-db
    databaseName: campus_sports_db
    user: campus_user
    region: oregon
    plan: free
